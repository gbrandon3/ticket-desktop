  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

<body>
  <script>
    (function() {
      try {
        var ver = '20261030_v5';
        if (window.localStorage && localStorage.getItem('santi_sw_clean') !== ver) {
          localStorage.setItem('santi_sw_clean', ver);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            });
          }
        }
      } catch (e) {}
    })();
  </script>
  <script src="flutter_bootstrap.js?v=20261030_v5" async></script>
</body>
