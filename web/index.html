<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tickets_app">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="icon.svg"/>

  <title>tickets_app</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function() {
      try {
        var path = window.location.pathname || '';
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // Si el cliente de correo (Gmail, Outlook) codificó '#' como '%23'
        if (window.location.href.indexOf('%23') !== -1) {
          window.location.replace(window.location.href.replace(/%23/g, '#'));
          return;
        }

        // Si se abrió como URL limpia sin hash: /consulta o /consulta?q=...
        if (path.indexOf('/consulta') !== -1 && !hash) {
          var query = search;
          if (!query && path.indexOf('/consulta/') !== -1) {
            var parts = path.split('/consulta/');
            if (parts.length > 1 && parts[1]) {
              query = '?q=' + encodeURIComponent(parts[1]);
            }
          }
          window.location.replace('/#/consulta' + query);
          return;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=20261119-06" async></script>
</body>
</html>
